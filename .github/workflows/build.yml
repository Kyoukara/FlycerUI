name: Build FlycerUI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Aftman
        uses: ok-nick/setup-aftman@v0.4.2
        with:
          token: ${{ github.token }}

      - name: Install tools
        run: |
          aftman install --no-trust-check
          echo "$HOME/.aftman/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.aftman/bin:$PATH"
          darklua --version

      - name: Build FlycerUI
        run: npm run build

      - name: Commit updated dist/main.lua
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "build: update dist/main.lua"
          file_pattern: dist/main.lua build/package.lua
